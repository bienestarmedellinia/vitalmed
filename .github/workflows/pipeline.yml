name: pipeline-ecv

# El pipeline corre en los runners de GitHub (NO en la Raspberry Pi).
on:
  push:
    branches: [ main ]
    # Cambios solo de portal/documentación no requieren recalcular datos
    # (GitHub Pages republica docs/ por su cuenta).
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "instrucciones.txt"
      - "scripts/portal_smoke.py"
      - ".github/workflows/portal.yml"
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:        # ejecución manual desde la pestaña Actions
  schedule:
    - cron: "0 7 1 * *"     # día 1 de cada mes (datos SIATA mensuales)

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # para commitear los outputs regenerados
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Configurar Node (prueba de paridad del motor web)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1) Descargar datos desde fuentes oficiales
        run: python scripts/01_descargar.py

      - name: 2) Validar consistencia (llave territorial)
        run: python scripts/03_validar.py

      - name: 3) Limpiar y homologar
        run: python scripts/02_limpiar.py

      - name: 4) Integrar (tabla agregada por territorio)
        run: python scripts/04_integrar.py

      - name: 5) Analizar (hallazgo cuantificado por comuna)
        run: python scripts/05_analizar.py

      - name: 6) Visualizar (gráficos PNG + diagrama del pipeline)
        run: python scripts/06_visualizar.py

      - name: 6b) Procesar SIATA PM2.5 por estación (ambiental)
        run: python scripts/08_siata.py

      - name: 6c) Procesar mortalidad DANE (EEVV mensual por causa)
        run: python scripts/10_dane_eevv.py

      - name: 6d) Procesar SIVIGILA (serie semanal INS)
        run: python scripts/11_sivigila.py

      - name: 6e) Procesar RIPS (morbilidad anual MinSalud, contexto)
        run: python scripts/12_rips.py

      - name: 6f) Generar mapa del hero (SVG de los 21 territorios, GeoMedellín)
        # Procesamiento geográfico en el runner (NO en la Raspberry Pi). Si GeoMedellín
        # no responde, no se tumba el pipeline: queda el mapa ya versionado en docs/.
        run: |
          python scripts/13_mapa_hero.py || echo "mapa - se conserva docs/mapa_comunas.svg versionado"

      - name: 6g) Descargar foto del banner (Wikimedia, CC BY-SA, sin procesar)
        run: |
          python scripts/14_foto_hero.py || echo "foto - se conserva docs/hero_medellin.jpg versionado"

      - name: 7) Construir knowledge base del asistente (fase 2)
        run: python scripts/07_construir_kb.py

      - name: 7b) Generar guia_entrega.pdf (ficha de hallazgos)
        run: python scripts/09_guia_entrega.py

      - name: 8) Probar el asistente (motor determinista)
        run: python asistente/test_motor.py

      - name: Publicar resultados como artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-ecv
          path: |
            outputs/tablas/
            outputs/graficos/
            outputs/kb/
            data/raw/_manifiesto_descarga.json
          if-no-files-found: warn

      - name: Commitear outputs regenerados al repo
        # Deja las tablas y gráficos SIEMPRE actualizados en el repositorio,
        # para que sean visibles sin descargar el artefacto. Solo outputs
        # agregados (sin PII); los microdatos crudos quedan excluidos por .gitignore.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs/tablas/ outputs/graficos/ outputs/kb/ docs/knowledge_base.json docs/datos/ docs/mapa_comunas.svg docs/hero_medellin.jpg guia_entrega.pdf
          if git diff --cached --quiet; then
            echo "Sin cambios en outputs."
          else
            git commit -m "chore(outputs): actualiza tablas y gráficos [skip ci]"
            git push
          fi
