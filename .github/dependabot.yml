# Dependabot: mantiene al día las acciones fijadas por SHA y las dependencias
# de Python. Abre PRs (no toca main directamente); revisarlas antes de fusionar.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
