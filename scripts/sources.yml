# Manifiesto de fuentes oficiales — Medellín, Bienestar Basado en Datos
# Todas las URLs fueron verificadas en el portal oficial (nov 2026).
# El pipeline descarga EXCLUSIVAMENTE desde estas URLs (datos reales).
